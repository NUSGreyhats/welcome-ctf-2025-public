services:
  ski_buddy_app:
    container_name: ski-buddy-app
    build:
      context: ski-buddy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "33335:8000"
    environment:
      - FLAG=grey{fake_flag}
      - ADMIN_HOST=ski-buddy-admin
      - ADMIN_PORT=3001
      - JWT_SECRET=fake_secret
  ski_buddy_admin:
    container_name: ski-buddy-admin
    build:
      context: admin
      dockerfile: Dockerfile
    restart: always

