<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zip Storage</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, "Apple Color Emoji", "Segoe UI Emoji"; margin: 2rem; }
    header { display: flex; align-items: center; gap: 1rem; }
    .hint { background: #fff8c5; border: 1px solid #f2e088; padding: .75rem 1rem; border-radius: .5rem; max-width: 800px; }
    form { margin-top: 1rem; display: flex; gap: .5rem; align-items: center; }
    input[type=file] { padding: .25rem; }
    button { padding: .4rem .9rem; border-radius: .5rem; border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
    h2 { margin-top: 2rem; }
    ul { list-style: none; padding-left: 0; }
    li { margin: .25rem 0; }
    code { background: #f6f8fa; padding: .1rem .3rem; border-radius: .25rem; }
    .path { color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Zip Storage</h1>
  </header>

  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <button type="submit">Upload</button>
  </form>

  <h2>Files in <code>storage</code></h2>
  <ul>
    {% for entry in entries %}
      <li>{{ entry | safe }}</li>
    {% endfor %}
  </ul>
</body>
</html>
