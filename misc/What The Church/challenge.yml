description: 'I''m taking a course on theoretical Computer Science, and prof gave
  me this question as part of my assignment:


  ```


  In SKI combinator logic, the following expression S(I)(S(I)(S(I)(K(S(S(K(S))(K))(I)))))(S(S(K(S))(K))(S(I)(I)))
  is a church integer n. What is log_2(n)?


  ```


  I simplified the SKI expression with help from my best friends ChatGPT and Gemini,
  but when I submitted the answer on the Canvas Quiz, it said that my answer was wrong!


  I double checked my answer with prof (and told him how both LLMs came to the same
  answer), but he just chuckled and said that the question was taken from a famous
  test for LLMs, and how humanity would be cooked if they could solve it???


  What did prof mean??? Can you help me solve this problem, I don''t want to fail
  this course!


  Flag Format: `grey{x}`, where `x = log_2(n)`'
